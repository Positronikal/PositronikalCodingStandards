[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "positronikal-standards-check"
dynamic = ["version"]
description = "Validate repository compliance with Positronikal coding standards"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "COPYING" }
authors = [{ name = "Positronikal", email = "hoyt.harness@gmail.com" }]
keywords = [
    "coding standards",
    "validation",
    "testing",
    "compliance",
    "positronikal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "pytest>=7.0.0",
    "pyyaml>=6.0",
    "tomli>=1.2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "safety>=3.0.0",
    "cyclonedx-bom>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/Positronikal/PositronikalCodingStandards"
Repository = "https://github.com/Positronikal/PositronikalCodingStandards"

[project.scripts]
positronikal-check = "positronikal_standards_check.cli:main"
psc = "positronikal_standards_check.cli:main"

[project.entry-points."pytest11"]
positronikal_standards = "positronikal_standards_check.tests.test_standards"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "positronikal_standards_check/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["positronikal_standards_check"]
